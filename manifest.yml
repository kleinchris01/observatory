modules:
  macro:
    - key: atlasiq-custom-field-governance-macro
      resource: main
      resolver:
        function: resolver
      title: Observatory
      description: Explore Jira custom fields, contexts, and per-project usage from
        Confluence.
      categories:
        - reporting
        - admin
      layout: block
  jira:adminPage:
    - key: atlasiq-observatory-admin
      resource: admin
      resolver:
        function: admin-resolver
      title: Observatory Admin
  trigger:
    - key: auto-snapshot-trigger
      function: auto-snapshot
      events:
        - avi:scheduled:daily
    # Hourly is the finest interval Forge offers -- there is no day-of-week or time-of-day
    # trigger, so "runs Sunday at midnight" is implemented as "check every hour, most of
    # which do nothing." See quickScanScheduleCheck for the actual due-time comparison.
    - key: quick-scan-scheduler-trigger
      function: quick-scan-scheduler
      events:
        - avi:scheduled:hourly
    # Weekly, not daily: the daily slot is taken by auto-snapshot, and retention only
    # deletes report_jobs completed more than 7 days ago -- running it more often than
    # the retention window buys nothing. Snapshot version pruning already runs inline
    # after each successful build; this is the only path that prunes report_jobs at all.
    - key: retention-cleanup-trigger
      function: retention-cleanup
      events:
        - avi:scheduled:weekly
  rovo:agent:
    - key: observatory-field-expert
      name: Observatory Field Expert
      description: A Jira custom field specialist that explains field usage, scope, contexts, and governance signals.
      prompt: resource:agent-resources;prompts/jira-field-expert.txt
      conversationStarters:
        - Find the most heavily used custom fields on this site
        - Explain where customfield_11492 is used and why it matters
        - Show fields with global context and the highest populated issue counts
      actions:
        - search-field-catalog
        - inspect-field-governance
    - key: observatory-automation-expert
      name: Observatory Automation Expert
      description: A Jira Automation specialist that explains what the site's rules do, what fields and statuses they depend on, and whether a change is safe to make.
      prompt: resource:agent-resources;prompts/jira-automation-expert.txt
      conversationStarters:
        - Is the Story Points field safe to delete?
        - Which automation rules store a credential in plaintext?
        - What does the rule "Auto-Populate Child Fields from Parent Story" touch?
        - Which rules trigger when an issue moves to Done?
      actions:
        - search-automation-rules
        - inspect-automation-rule
        - automation-usage
  action:
    - key: search-field-catalog
      name: Search field catalog
      function: rovo-search-fields
      actionVerb: GET
      description: Search the Observatory field snapshot by field name, id, type, or description and return ranked field matches with usage totals.
      inputs:
        query:
          title: Search query
          type: string
          required: true
          description: Field name, field id, type, or a short phrase describing the field to find.
        fieldType:
          title: Field type
          type: string
          required: false
          description: Optional field type filter such as multiselect, datepicker, or textarea.
        sortBy:
          title: Sort order
          type: string
          required: false
          description: Optional sort order. Use usage-desc, usage-asc, name-asc, or name-desc.
        maxResults:
          title: Maximum results
          type: integer
          required: false
          description: Optional maximum number of matches to return, from 1 to 10.
    - key: inspect-field-governance
      name: Inspect field governance
      function: rovo-inspect-field
      actionVerb: GET
      description: Retrieve a detailed field governance summary for one Jira custom field, including full totals, contexts, and project usage.
      inputs:
        fieldIdentifier:
          title: Field identifier
          type: string
          required: true
          description: A field id like customfield_11492 or a field name such as SIT/Attribute.
        projectPage:
          title: Project usage page
          type: integer
          required: false
          description: Optional page number for the active-project breakdown list.
        includeProjectBreakdown:
          title: Include project breakdown
          type: boolean
          required: false
          description: Whether to include project-level usage rows in the response.
    - key: search-automation-rules
      name: Search automation rules
      function: rovo-search-rules
      actionVerb: GET
      description: Search the site's Jira Automation rules by name and return their state, trigger, project scope and any governance findings.
      inputs:
        query:
          title: Search query
          type: string
          required: true
          description: Words from the rule name, such as "approval" or "copy fields to subtasks".
        state:
          title: Rule state
          type: string
          required: false
          description: Optional filter. Use enabled, disabled, or any.
        maxResults:
          title: Maximum results
          type: integer
          required: false
          description: Optional maximum number of rules to return, from 1 to 20.
    - key: inspect-automation-rule
      name: Inspect automation rule
      function: rovo-inspect-rule
      actionVerb: GET
      description: Retrieve one automation rule's state, trigger, project scope, governance findings, and the fields and statuses it reads, writes or triggers on.
      inputs:
        ruleIdentifier:
          title: Rule identifier
          type: string
          required: true
          description: A numeric rule id such as 28499275, or words from the rule name.
    - key: automation-usage
      name: Automation usage for a field or status
      function: rovo-auto-usage
      actionVerb: GET
      description: Report which automation rules write, read or trigger on a named Jira field or status, and whether it is safe to delete. Use this for any question about whether changing a field or status will break automation.
      inputs:
        name:
          title: Field or status name
          type: string
          required: true
          description: The exact field or status name, such as "Story Points" or "Waiting for customer".
        kind:
          title: Kind
          type: string
          required: false
          description: Either field or status. Defaults to field.
  consumer:
    - key: inventory-snapshot-consumer
      queue: inventory-snapshot-queue
      function: snapshot-consumer
  function:
    - key: resolver
      handler: index.handler
    - key: admin-resolver
      handler: index.adminHandler
    - key: auto-snapshot
      handler: index.autoSnapshotCheck
    - key: quick-scan-scheduler
      handler: index.quickScanScheduleCheck
    - key: retention-cleanup
      handler: index.runRetentionCleanup
    - key: sql-migrate
      handler: index.runProjectStorageMigrations
    - key: rovo-search-fields
      handler: index.rovoSearchFields
    - key: rovo-inspect-field
      handler: index.rovoInspectField
    - key: rovo-search-rules
      handler: index.rovoSearchAutomationRules
    - key: rovo-inspect-rule
      handler: index.rovoInspectAutomationRule
    - key: rovo-auto-usage
      handler: index.rovoAutomationUsage
    - key: snapshot-consumer
      handler: index.consumeSnapshot
      timeoutSeconds: 900
  sql:
    - key: project-data
      engine: mysql

resources:
  - key: main
    path: static/dist
  - key: admin
    path: static/dist-admin
  - key: agent-resources
    path: resource/agent

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/c11559cd-90ed-43a7-9a9b-80866237cd15

permissions:
  scopes:
    - read:confluence-content.summary
    - read:jira-work
    - read:field:jira
    - read:field-configuration:jira
    - read:project:jira
    - read:issue-meta:jira
    - read:issue.changelog:jira
    - read:custom-field-contextual-configuration:jira
    - read:workflow:jira
    - read:workflow-scheme:jira
    - read:status:jira
    # Screen inventory. All read-only: Observatory reports what a form contains, it never
    # edits a screen, moves a field between tabs, or changes a mapping.
    #
    # Five scopes for one capability is a lot to put on a consent screen, and they are not
    # substitutable -- the chain runs project -> issue type screen scheme -> screen scheme
    # -> screen -> tab -> field, and each hop is gated separately. Dropping any one of them
    # breaks the traversal rather than degrading it.
    - read:screen:jira
    - read:screen-tab:jira
    - read:screen-field:jira
    - read:screen-scheme:jira
    - read:issue-type-screen-scheme:jira
    # Issue type pillar: the type catalog and the schemes that gate which types a project may
    # use. /rest/api/3/issuetype needs read:issue-type:jira; the three issuetypescheme
    # endpoints (list, /mapping, /project) each need read:issue-type-scheme:jira and are
    # gated on Jira admin, which manage:jira-configuration above already carries. Granular
    # scopes are conjunctive -- read:jira-work alone does not authorise the granular path --
    # so both are declared explicitly, exactly as the screen chain had to.
    - read:issue-type:jira
    - read:issue-type-scheme:jira
    # Granular scopes are CONJUNCTIVE. An endpoint needs every scope in its list, not any
    # one of them, and GET /rest/api/3/screens lists four: read:project:jira,
    # read:screen:jira, read:avatar:jira, read:project-category:jira. Two of the four were
    # declared, so the endpoint rejected the token. That is what "scope does not match"
    # meant -- not a closed platform, which is where two rounds of diagnosis were heading.
    #
    # Neither of these has anything to do with screens by name, which is exactly why they
    # were missed: the scope set for an endpoint is not guessable from what the endpoint
    # sounds like. Read it off the endpoint's own documentation, every time.
    - read:avatar:jira
    - read:project-category:jira
    # read:screenABLE-field:jira, not read:screen-field:jira. Both are real scopes -- forge
    # lint accepts either -- but only this one authorizes the tab-fields endpoint. That is
    # the whole reason a probe using a real screen id AND a real tab id still returned 401.
    #
    # `forge lint` validates that a scope EXISTS, never that it is the right one for the
    # endpoints the app calls. CONNECT-4131 closed on "every scope name is confirmed present
    # in Atlassian's registry", which was true and insufficient, and cost this pillar weeks.
    #
    # read:screen-field:jira is deliberately kept above for now: the probe reports both, so
    # the next run says which one answers before the dead one is dropped.
    - read:screenable-field:jira
    - manage:jira-configuration
    - read:jira-user
    # The People pillar. GET /rest/api/3/applicationrole (admin-only) returns, per Jira
    # product, the access groups whose members get a licence plus the seat numbers -- how
    # "who is licensed" is answered without any admin configuration. read:jira-user above
    # already covers the group/member enumeration that follows.
    - read:application-role:jira
    # Saved filters. The only endpoint that enumerates them site-wide is
    # /rest/api/3/filter/search -- /rest/api/3/filter returns the caller's favourites, which
    # is a personal list rather than an inventory. One new scope, and it is the one that
    # makes a filter's JQL readable, which is what the field and status joins are built on.
    - read:filter:jira
    # Dashboards. /rest/api/3/dashboard/search is the site-wide enumerator; the unqualified
    # /rest/api/3/dashboard returns only the caller's own.
    - read:dashboard:jira
    # Gadget CONFIGURATION, which is where the filter a gadget points at is recorded. Without
    # it a dashboard is a list of titles: "Filter Results: Open Bugs" tells a reader nothing a
    # machine can act on, and matching the title against filter names would produce a
    # dependency graph that is right most of the time -- the worst kind, since every claim
    # this app makes about what depends on what is load-bearing for a deletion decision.
    #
    # With it, dashboard -> gadget -> filter -> field resolves exactly, which is what lets a
    # field card say which dashboards break if the field goes.
    - read:dashboard.property:jira
    # The JSM Assets (CMDB) pillar. Assets is a gateway API (api.atlassian.com), reached via
    # Stargate. read:servicedesk-request covers the workspace-id discovery hop on the site;
    # the read:cmdb-* scopes cover the structure endpoints (schemas, object types, attributes).
    # This ships behind a probe first -- the probe's own responses confirm which scope each
    # Assets endpoint actually needs, the same way the screen and automation probes did.
    - read:servicedesk-request:jira-service-management
    - read:cmdb-object:jira
    - read:cmdb-schema:jira
    - read:cmdb-attribute:jira
    - read:cmdb-type:jira
    - read:chat:rovo
    - storage:app

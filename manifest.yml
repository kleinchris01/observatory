modules:
  macro:
    - key: atlasiq-custom-field-governance-macro
      resource: main
      resolver:
        function: resolver
      title: Observatory
      description: Explore Jira custom fields, contexts, and per-project usage from
        Confluence.
      categories:
        - reporting
        - admin
      layout: block
  jira:adminPage:
    - key: atlasiq-observatory-admin
      resource: admin
      resolver:
        function: admin-resolver
      title: Observatory Admin
  trigger:
    - key: auto-snapshot-trigger
      function: auto-snapshot
      events:
        - avi:scheduled:daily
    # Hourly is the finest interval Forge offers -- there is no day-of-week or time-of-day
    # trigger, so "runs Sunday at midnight" is implemented as "check every hour, most of
    # which do nothing." See quickScanScheduleCheck for the actual due-time comparison.
    - key: quick-scan-scheduler-trigger
      function: quick-scan-scheduler
      events:
        - avi:scheduled:hourly
    # Weekly, not daily: the daily slot is taken by auto-snapshot, and retention only
    # deletes report_jobs completed more than 7 days ago -- running it more often than
    # the retention window buys nothing. Snapshot version pruning already runs inline
    # after each successful build; this is the only path that prunes report_jobs at all.
    - key: retention-cleanup-trigger
      function: retention-cleanup
      events:
        - avi:scheduled:weekly
  rovo:agent:
    - key: observatory-field-expert
      name: Observatory Field Expert
      description: A Jira custom field specialist that explains field usage, scope, contexts, and...
      prompt: resource:agent-resources;prompts/jira-field-expert.txt
      conversationStarters:
        - Find the most heavily used custom fields on this site
        - Explain where customfield_11492 is used and why it matters
        - Show fields with global context and the highest populated issue counts
      actions:
        - search-field-catalog
        - inspect-field-governance
    - key: observatory-automation-expert
      name: Observatory Automation Expert
      description: A Jira Automation specialist that explains what the site's rules do, what fields and...
      prompt: resource:agent-resources;prompts/jira-automation-expert.txt
      conversationStarters:
        - Is the Story Points field safe to delete?
        - Which automation rules store a credential in plaintext?
        - What does the rule "Auto-Populate Child Fields from Parent Story" touch?
        - Which rules trigger when an issue moves to Done?
      actions:
        - search-automation-rules
        - inspect-automation-rule
        - automation-usage
    - key: observatory-workflow-expert
      name: Observatory Workflow Expert
      description: A Jira workflow and status specialist that explains the site's workflow schemes and...
      prompt: resource:agent-resources;prompts/workflow-expert.txt
      conversationStarters:
        - Give me an overview of the workflow and status estate
        - Which statuses look like duplicates of each other?
        - Which workflow schemes have no Done status or are oversized?
        - What would break if I retired the "On Hold" status?
      actions:
        - search-workflows
        - inspect-workflow
        - workflow-impact
    - key: observatory-issuetype-expert
      name: Observatory Issue Type Expert
      description: A Jira issue type specialist that explains the type catalogue and its schemes, which...
      prompt: resource:agent-resources;prompts/issuetype-expert.txt
      conversationStarters:
        - Give me an overview of the issue type catalogue and its schemes
        - Which issue type names look like duplicates of each other?
        - Which issue type schemes does no project use?
        - What would break if I retired the "Change Request" issue type?
      actions:
        - search-issue-types
        - inspect-issue-type
        - issue-type-impact
    - key: observatory-access-expert
      name: Observatory Access Expert
      description: A Jira access specialist that explains permission, issue-security and notification...
      prompt: resource:agent-resources;prompts/access-expert.txt
      conversationStarters:
        - Give me an overview of the access schemes on this site
        - Which permission schemes grant Browse Projects to anyone?
        - Which issue-security schemes have a level with no members?
        - Everywhere the "jira-administrators" group is named across schemes and roles
      actions:
        - search-access
        - inspect-access
        - access-impact
    - key: observatory-people-expert
      name: Observatory People Expert
      description: A Jira user and group specialist that explains the licensed-user roster, who owns which...
      prompt: resource:agent-resources;prompts/people-expert.txt
      conversationStarters:
        - Give me an overview of the licensed-user roster and its ownership graph
        - Which accounts own the most filters, dashboards and automation rules?
        - Which deactivated accounts still own things or route automation work?
        - What breaks if I deactivate a specific account?
      actions:
        - search-people
        - inspect-person
        - person-impact
    - key: observatory-assets-expert
      name: Observatory Assets Expert
      description: A JSM Assets (CMDB) specialist that explains the object schema and object type...
      prompt: resource:agent-resources;prompts/assets-expert.txt
      conversationStarters:
        - Give me an overview of the Assets object schemas and their structure
        - Which object schemas look dead or empty?
        - Which reference attributes point at an object type that no longer exists?
        - What depends on a specific object type?
      actions:
        - search-assets
        - inspect-asset
        - asset-impact
    - key: observatory-estate-expert
      name: Observatory Priorities Expert
      description: A specialist in Jira's two global value lists, priorities and resolutions, explaining...
      prompt: resource:agent-resources;prompts/estate-expert.txt
      conversationStarters:
        - Give me an overview of the priority and resolution lists
        - Which resolution names look like duplicates of each other?
        - Do the priority and resolution lists each have a default?
        - Why split "Done", "Fixed" and "Complete" into separate resolutions?
      actions:
        - search-estate
        - inspect-estate
    - key: observatory-screen-expert
      name: Observatory Screen Expert
      description: A Jira screen specialist that explains the screen catalogue, tabs and fields, the...
      prompt: resource:agent-resources;prompts/screen-expert.txt
      conversationStarters:
        - Give me an overview of the screen catalogue and its schemes
        - Which screens carry the most fields?
        - Which screens does no screen scheme route to?
        - What routes to a specific screen, and would anything break if I changed it?
      actions:
        - search-screens
        - inspect-screen
        - screen-impact
    - key: observatory-change-expert
      name: Observatory Change Expert
      description: A specialist in Observatory's configuration change-history timeline, explaining what...
      prompt: resource:agent-resources;prompts/change-expert.txt
      conversationStarters:
        - What has changed in the estate's configuration recently?
        - Show me every recorded change to permission schemes
        - Has the "In Review" status been modified since the baseline?
        - Which pillar has seen the most configuration change?
      actions:
        - search-changes
        - inspect-changes
    - key: observatory-project-expert
      name: Observatory Project Expert
      description: A specialist in per-project configuration - which schemes a project resolves to, its...
      prompt: resource:agent-resources;prompts/project-expert.txt
      conversationStarters:
        - Give me an overview of a specific project's configuration
        - Which workflow scheme does project ABC use, and how many projects share it?
        - What schemes and project-role actors does project ABC resolve to?
        - How adopted is project ABC compared with the site?
      actions:
        - search-projects
        - inspect-project

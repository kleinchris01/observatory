<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Observatory Admin</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #172b4d;
      }
      #boot-status {
        margin: 24px;
        padding: 16px 18px;
        border: 1px solid #dfe1e6;
        border-radius: 12px;
        background: #ffffff;
      }
      #boot-status[data-state="error"] {
        border-color: #de350b;
        color: #ae2a19;
      }
    </style>
    <script>
      window.addEventListener("error", function (event) {
        var node = document.getElementById("boot-status");
        if (!node) return;
        node.dataset.state = "error";
        node.textContent = "Frontend bootstrap error: " + (event.message || "Unknown error");
      });
      window.addEventListener("unhandledrejection", function (event) {
        var node = document.getElementById("boot-status");
        if (!node) return;
        node.dataset.state = "error";
        var msg = event.reason && event.reason.message ? event.reason.message : String(event.reason || "Unknown rejection");
        node.textContent = "Unhandled promise rejection: " + msg;
      });
    </script>
    <script type="module" crossorigin src="./assets/admin-B4-Dhs-z.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/admin-CVfPWf3g.css">
  </head>
  <body>
    <div id="boot-status">Loading Observatory Admin...</div>
    <div id="root"></div>
  </body>
</html>

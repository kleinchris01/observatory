name: Deploy — Forge

# Triggers on push to main (after CI) or manually with environment selection.
# Requires FORGE_EMAIL and FORGE_API_TOKEN repository secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Forge deployment environment
        type: choice
        options: [development, staging, production]
        default: production

env:
  NODE_VERSION: "22"
  FORGE_ENV: ${{ inputs.environment || 'production' }}

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Build macro + admin frontends
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-dist
          path: |
            static/dist/
            static/dist-admin/
          retention-days: 1

  deploy:
    name: Forge Deploy (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile

      - name: Restore build artifact
        uses: actions/download-artifact@v4
        with:
          name: forge-dist
          path: static/

      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest

      - name: Deploy to Forge
        run: forge deploy --environment ${{ env.FORGE_ENV }} --no-interactive
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

      - name: Write job summary
        run: |
          echo "### ✅ Observatory Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ env.FORGE_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        if: vars.SLACK_WEBHOOK_URL != ''
        with:
          payload: |
            {
              "text": "❌ Observatory (Forge) deploy failed",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*❌ Observatory Forge deploy FAILED*\nEnvironment: `${{ env.FORGE_ENV }}`\nCommit: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

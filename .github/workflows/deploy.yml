name: Deploy — Forge

# Push to master auto-deploys to development only (fast feedback, low stakes).
# Staging/production are manual-only via workflow_dispatch, matching the
# deliberate dev -> staging -> production promotion path in RUNBOOK.md.
# Requires FORGE_EMAIL and FORGE_API_TOKEN repository secrets.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Forge deployment environment
        type: choice
        options: [development, staging, production]
        default: production

env:
  NODE_VERSION: "24"
  FORGE_ENV: ${{ inputs.environment || 'development' }}

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Build macro + admin frontends
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-dist
          path: |
            static/dist/
            static/dist-admin/
          retention-days: 1

  deploy:
    name: Forge Deploy (${{ inputs.environment || 'development' }})
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment || 'development' }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile

      - name: Restore build artifact
        uses: actions/download-artifact@v4
        with:
          name: forge-dist
          path: static/

      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest

      # A scope change makes Forge request MAJOR_VERSION_RULE approval before it will
      # deploy, because installs will need an administrator to accept a new consent screen.
      #
      # Auto-acknowledged for DEVELOPMENT only, and deliberately not for staging or
      # production. Development is where a scope change is tested, and blocking the one
      # environment whose purpose is to try things means a scope change cannot be exercised
      # before it is promoted -- which is the wrong way round.
      #
      # Staging and production keep the prompt. They are workflow_dispatch-only, so a human
      # is already at the keyboard; that human should have to type the flag and think about
      # what re-consent means for every existing install. If this is ever relaxed there,
      # the guard is gone entirely.
      #
      # The change stays visible either way: ci.yml writes the approval into the PR's job
      # summary, so it is reviewed before it reaches this workflow.
      - name: Deploy to Forge
        run: |
          if [ "${{ env.FORGE_ENV }}" = "development" ]; then
            forge deploy --environment development --non-interactive --approve MAJOR_VERSION_RULE
          else
            forge deploy --environment ${{ env.FORGE_ENV }} --non-interactive
          fi
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          # See ci.yml -- bypasses the first-run analytics prompt directly rather
          # than relying on a prior `forge settings set` step's disk write.
          FORGE_DISABLE_ANALYTICS: "true"

      - name: Write job summary
        run: |
          echo "### ✅ Observatory Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ env.FORGE_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **By** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        if: vars.SLACK_WEBHOOK_URL != ''
        with:
          payload: |
            {
              "text": "❌ Observatory (Forge) deploy failed",
              "blocks": [{
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*❌ Observatory Forge deploy FAILED*\nEnvironment: `${{ env.FORGE_ENV }}`\nCommit: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits via the GitHub API

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Forge Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Build frontend (forge lint validates that manifest resource paths exist on disk)
        run: |
          npm run build:macro
          npm run build:admin
      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest
      # `forge lint` exits 1 for three different outcomes: errors, warnings, and APPROVALS.
      # An approval is not a defect -- it is Forge reporting that the change will require
      # admin re-consent on upgrade, which is information, not a fault. Treating all three
      # as failure meant any deliberate scope change was unmergeable.
      #
      # So: fail on errors or warnings, surface an approval loudly and continue.
      #
      # The approval line is worth reading rather than suppressing. It is the closest thing
      # this repo currently has to the manifest drift detection tracked by CONNECT-3887 --
      # an unintended scope escalation shows up here first, and printing it into the job
      # summary is most of what that story asks for.
      - name: Forge manifest lint
        run: |
          set +e
          output=$(forge lint 2>&1)
          status=$?
          echo "$output"

          if echo "$output" | grep -qE '[1-9][0-9]* error|[1-9][0-9]* warning'; then
            echo "::error::forge lint reported errors or warnings"
            exit 1
          fi

          if echo "$output" | grep -q 'approval'; then
            echo "::warning::Manifest change requires admin approval on upgrade — review the scope diff below"
            {
              echo "### Forge manifest approval required"
              echo ""
              echo "This change alters the app's declared scopes or permissions, so installs"
              echo "will need an administrator to accept an updated consent screen."
              echo ""
              echo '```'
              echo "$output" | grep -A 2 'approval'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit $status
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          # Bypasses the first-run analytics prompt directly (checked before the
          # cached settings file), instead of relying on `forge settings set`
          # persisting to disk before the next step reads it back -- that step
          # ordering proved flaky across separate CI steps/processes.
          FORGE_DISABLE_ANALYTICS: "true"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks diffs against the PR base commit; shallow clone can't reach it
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true # tracked separately; pre-existing transitive vulns in @forge/bridge, not a gate condition yet
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Build macro frontend
        run: npm run build:macro
      - name: Build admin frontend
        run: npm run build:admin
      - name: Verify build outputs
        run: |
          test -d static/dist && echo "Macro dist OK — $(du -sh static/dist | cut -f1)"
          test -d static/dist-admin && echo "Admin dist OK — $(du -sh static/dist-admin | cut -f1)"

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Check all passed
        run: |
          [[ "${{ needs.lint.result }}" == "success" ]] || (echo "Lint failed" && exit 1)
          [[ "${{ needs.test.result }}" == "success" ]] || (echo "Tests failed" && exit 1)
          [[ "${{ needs.security.result }}" == "success" ]] || (echo "Security failed" && exit 1)
          [[ "${{ needs.build.result }}" == "success" ]] || (echo "Build failed" && exit 1)
          echo "All CI checks passed ✓"

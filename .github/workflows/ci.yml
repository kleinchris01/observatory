name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits via the GitHub API

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: Forge Lint
    runs-on: ubuntu-latest
    # `secrets` cannot be referenced from a step-level `if`, so the presence check is
    # hoisted to a job-level env var. Empty for any run using the Dependabot secret
    # store, which is a separate store from Actions secrets.
    env:
      HAS_FORGE_CREDENTIALS: ${{ secrets.FORGE_API_TOKEN != '' && secrets.FORGE_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Build frontend (forge lint validates that manifest resource paths exist on disk)
        run: |
          npm run build:macro
          npm run build:admin
      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest
      # Two separate problems are handled here, and both fixes are needed. Dropping either
      # one re-breaks the case the other was written for.
      #
      # WHEN IT RUNS: `forge lint` requires an authenticated CLI even though it only
      # validates the manifest statically. Dependabot pull requests use the Dependabot
      # secret store rather than Actions secrets, so these resolve to empty there and the
      # CLI exits with "Not logged in" -- which failed the job, failed CI Gate, and left
      # every Dependabot PR red regardless of content, including ones touching nothing but
      # .github/workflows.
      #
      # Skipping rather than granting Dependabot access to the credentials is deliberate.
      # A dependency-bump branch is the one place where third-party code arrives in CI;
      # deploy credentials do not belong in that blast radius. The steps above -- npm ci
      # against the proposed lockfile, plus both Vite builds -- are the part that actually
      # validates a dependency change, and they need no credentials at all.
      #
      # WHAT COUNTS AS FAILURE: `forge lint` exits 1 for three different outcomes -- errors,
      # warnings, and APPROVALS. An approval is not a defect; it is Forge reporting that the
      # change will require admin re-consent on upgrade, which is information. Treating all
      # three as failure made any deliberate scope change unmergeable.
      #
      # So: fail on errors or warnings, surface an approval loudly and continue. The
      # approval line is worth reading rather than suppressing -- it is the closest thing
      # this repo has to the manifest drift detection tracked by CONNECT-3887, since an
      # unintended scope escalation shows up here first.
      - name: Forge manifest lint
        if: env.HAS_FORGE_CREDENTIALS == 'true'
        run: |
          set +e
          output=$(forge lint 2>&1)
          status=$?
          echo "$output"

          if echo "$output" | grep -qE '[1-9][0-9]* error|[1-9][0-9]* warning'; then
            echo "::error::forge lint reported errors or warnings"
            exit 1
          fi

          if echo "$output" | grep -q 'approval'; then
            echo "::warning::Manifest change requires admin approval on upgrade — review the scope diff below"
            {
              echo "### Forge manifest approval required"
              echo ""
              echo "This change alters the app's declared scopes or permissions, so installs"
              echo "will need an administrator to accept an updated consent screen."
              echo ""
              echo '```'
              echo "$output" | grep -A 2 'approval'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit $status
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
          # Bypasses the first-run analytics prompt directly (checked before the
          # cached settings file), instead of relying on `forge settings set`
          # persisting to disk before the next step reads it back -- that step
          # ordering proved flaky across separate CI steps/processes.
          FORGE_DISABLE_ANALYTICS: "true"

      # Makes the skip visible in the job summary. Without it, a run where the manifest
      # was never linted looks identical to one where it was linted and passed.
      - name: Note skipped manifest lint
        if: env.HAS_FORGE_CREDENTIALS != 'true'
        run: |
          echo "::notice title=Forge manifest lint skipped::No Forge credentials in this context (expected for Dependabot pull requests). npm ci and both Vite builds still ran. The manifest is linted on the merge to master."

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks diffs against the PR base commit; shallow clone can't reach it
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
        # Still non-blocking, but no longer for want of triage. As of 31 Jul 2026 the
        # remaining high advisories are the linkify-it chain under @forge/bridge, for
        # which no fixed vendor release exists -- see SECURITY_CHECKLIST.md section 7 for
        # the per-package rationale and re-check trigger. Making this a gate today would
        # block every PR on something nobody can fix.
        continue-on-error: true
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --frozen-lockfile
      - name: Build macro frontend
        run: npm run build:macro
      - name: Build admin frontend
        run: npm run build:admin
      # Checks for index.html, not just the directory. A trial Vite 8 upgrade on
      # 31 Jul 2026 produced static/dist-admin/ containing assets but NO index.html --
      # the renameAdminHtml plugin's generateBundle hook does not fire under rolldown,
      # so the rename silently no-ops and the build still reports success. A directory
      # existence check passes happily on an artifact that would take the admin page
      # down entirely.
      - name: Verify build outputs
        run: |
          for bundle in dist dist-admin; do
            entry="static/$bundle/index.html"
            test -f "$entry" || { echo "::error::$entry missing — the bundle has no HTML entry point"; exit 1; }
            grep -q '<script' "$entry" || { echo "::error::$entry references no script"; exit 1; }
            echo "$bundle OK — $(du -sh "static/$bundle" | cut -f1)"
          done

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, test, security, build]
    if: always()
    steps:
      - name: Check all passed
        run: |
          [[ "${{ needs.lint.result }}" == "success" ]] || (echo "Lint failed" && exit 1)
          [[ "${{ needs.test.result }}" == "success" ]] || (echo "Tests failed" && exit 1)
          [[ "${{ needs.security.result }}" == "success" ]] || (echo "Security failed" && exit 1)
          [[ "${{ needs.build.result }}" == "success" ]] || (echo "Build failed" && exit 1)
          echo "All CI checks passed ✓"

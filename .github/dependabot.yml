version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      forge-sdk:
        patterns:
          - "@forge/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@vitejs/*"
          - "vite"
          - "vitest"
    ignore:
      - dependency-name: "@forge/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
